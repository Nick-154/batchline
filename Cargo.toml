[package]
name = "batchline"
version = "0.1.0"
edition = "2021"
description = "A dynamic-batching inference server for ONNX models"
license = "MIT"
repository = "https://github.com/Nick-154/batchline"
readme = "README.md"

[dependencies]
onyx = { git = "file:///home/claude/onyx" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
